<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oak Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div>
    <h1>Oak Admin</h1>
    <div class="sub">driver instances, live state, and actions</div>
  </div>
  <div class="row">
    <span class="status-pill off" id="countPill">no instances running</span>
    <nav><a href="live.html" target="_blank" rel="noopener">Open Live View ↗</a></nav>
  </div>
</header>
<main>
  <div class="driver-layout">
    <div>
      <div class="card">
        <h2>Running instances</h2>
        <div id="instancesList"><p class="empty-hint">Loading…</p></div>
      </div>
      <div class="card" data-default-collapsed="true">
        <h2>Add instance</h2>
        <form id="add-instance-form">
          <div class="row" id="add-instance-fields"></div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="subtabs">
          <div class="st active" data-panel="stateSubPanel">State</div>
          <div class="st" data-panel="actionsSubPanel">Actions</div>
          <div class="st" data-panel="eventsSubPanel">Events</div>
          <div class="st" data-panel="configSubPanel">Config</div>
        </div>
        <select id="instanceFilter"></select>
      </div>
      <div style="margin-top:12px;">
        <div class="subpanel active" id="stateSubPanel">
          <table class="oak-table"><thead><tr><th>instance</th><th>state</th><th>value</th></tr></thead><tbody id="stateBody"></tbody></table>
        </div>
        <div class="subpanel" id="actionsSubPanel">
          <div class="tile-grid" id="actionsGrid"></div>
        </div>
        <div class="subpanel" id="eventsSubPanel">
          <div class="log-panel" id="eventsLog"></div>
        </div>
        <div class="subpanel" id="configSubPanel">
          <div id="configPanel"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
