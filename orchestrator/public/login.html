<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oak — Sign in</title>
<style>
  :root{ --bg:#f6f4ee; --raised:#ffffff; --ink:#1d2321; --faint:#686e68; --line:#dcd6c8; --accent:#0e7c86; --accent-ink:#fff; --bad:#b3403a; --bad-tint:#fbe9e6; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181a; --raised:#1c2224; --ink:#eef1ee; --faint:#78827c; --line:#2c3436; --accent:#4fd1c8; --accent-ink:#0a1f1e; --bad:#ef8a82; --bad-tint:#3a1c1a; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  form{ width:280px; background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:28px; display:flex; flex-direction:column; gap:14px; }
  h1{ font-size:1.05rem; margin:0 0 4px; }
  input{ width:100%; box-sizing:border-box; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.92rem; }
  input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  button{ padding:9px 11px; border-radius:8px; border:none; background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:.92rem; cursor:pointer; }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ display:none; background:var(--bad-tint); color:var(--bad); padding:8px 10px; border-radius:8px; font-size:.82rem; }
  .error.show{ display:block; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>🌳 Oak</h1>
  <div class="error" id="loginError"></div>
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus required />
  <button type="submit" id="loginBtn">Sign in</button>
</form>
<script>
document.getElementById("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("loginError");
  errEl.classList.remove("show");
  btn.disabled = true;
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errEl.textContent = body.error || "Sign in failed";
      errEl.classList.add("show");
      btn.disabled = false;
      return;
    }
    const params = new URLSearchParams(location.search);
    location.href = params.get("next") || "/admin.html";
  } catch (e) {
    errEl.textContent = "Could not reach the server";
    errEl.classList.add("show");
    btn.disabled = false;
  }
});
</script>
</body>
</html>
